<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Fintech PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <header id="global-header" class="header">
        <div class="header-brand">
            <button id="menu-toggle" class="menu-toggle-btn" aria-label="Menu" hidden>
                <span></span><span></span><span></span>
            </button>
            <h1 class="logo">Nexus</h1>
        </div>
        <div class="header-actions" id="header-public-actions">
            <a href="#inicio" class="nav-link" data-i18n="nav_home">Início</a>
            <button id="btn-login-open" class="btn btn-outline" data-i18n="nav_login">Fazer Login</button>
            <button id="btn-pwa-install" class="btn btn-primary" data-i18n="nav_download">Download App</button>
        </div>
        <div class="header-actions" id="header-private-actions" hidden>
            <div class="user-profile-badge" id="user-profile-shortcut" role="button" title="Configurações">
                <img id="header-user-avatar" src="icons/default-avatar.png" alt="Avatar">
                <span id="header-user-name">Carregando...</span>
            </div>
        </div>
    </header>

    <div class="app-layout">
        <aside id="app-sidebar" class="sidebar" hidden>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="sidebar-item active" data-target="dashboard">
                    <span class="icon">📊</span> <span class="label" data-i18n="menu_dashboard">Dashboard</span>
                </a>
                <a href="#transacoes" class="sidebar-item" data-target="transacoes">
                    <span class="icon">💳</span> <span class="label" data-i18n="menu_transacoes">Transações</span>
                </a>
                <a href="#planejamento" class="sidebar-item" data-target="planejamento">
                    <span class="icon">🎯</span> <span class="label" data-i18n="menu_planejamento">Planejamento</span>
                </a>
                <a href="#relatorios" class="sidebar-item" data-target="relatorios">
                    <span class="icon">📈</span> <span class="label" data-i18n="menu_relatorios">Relatórios</span>
                </a>
                <a href="#configuracoes" class="sidebar-item" data-target="configuracoes">
                    <span class="icon">⚙️</span> <span class="label" data-i18n="menu_configuracoes">Configurações</span>
                </a>
            </nav>
        </aside>

        <main id="main-content" class="main-content">
            
            <section id="view-auth" class="view active-view">
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-tabs">
                            <button class="tab-btn active" data-tab="login" data-i18n="auth_tab_login">Entrar</button>
                            <button class="tab-btn"

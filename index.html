<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Finanças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="container">
        <h2>Entrar no App Finanças</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required placeholder="Mínimo 3 letras">
            </div>
            <div class="input-group">
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" required placeholder="Mínimo 3 letras">
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <p id="login-error" class="error"></p>
    </div>

    <!-- TELA PRINCIPAL (DASHBOARD) -->
    <div id="app-screen" class="container hidden">
        <header class="header">
            <h1>Olá, <span id="user-greeting"></span>!</h1>
            <button id="logout-btn" class="btn-secondary">Sair</button>
        </header>

        <!-- CARDS DE RESUMO -->
        <div class="resumo-cards">
            <div class="card">
                <h3>Saldo Total</h3>
                <p id="saldo-total">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Receitas</h3>
                <p id="total-receitas" class="green">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Despesas</h3>
                <p id="total-despesas" class="red">R$ 0,00</p>
            </div>
        </div>

        <!-- FORMULÁRIO DE TRANSAÇÃO -->
        <section class="form-section">
            <h3>Nova Transação</h3>
            <form id="transacao-form">
                <div class="input-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" required>
                        <option value="">Selecione o tipo</option>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Primeiro selecione o tipo</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" step="0.01" min="0" required placeholder="0.00">
                </div>

                <button type="submit" class="btn">Adicionar Transação</button>
            </form>
            <p id="transacao-error" class="error"></p>
        </section>

        <!-- HISTÓRICO DE TRANSAÇÕES -->
        <section class="history-section">
            <h3>Histórico</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-transacoes">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b7fe8" />
    <meta name="description" content="Nexus - Plataforma Fintech para gestão financeira inteligente" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Nexus - Gestão Financeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="main-header">
            <div class="header-left">
                <button id="menu-toggle" class="icon-btn" aria-label="Menu">☰</button>
                <span class="brand">💰 Nexus</span>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema">
                    <span id="theme-icon">🌙</span>
                </button>
                <a href="#/login" id="header-login-link" class="nav-link" style="display:none;">Entrar</a>
                <span id="header-user" style="display:none;font-weight:500;"></span>
            </div>
        </header>

        <div class="app-container">
            <!-- Sidebar -->
            <nav id="sidebar" class="sidebar">
                <ul class="nav-list">
                    <li><a href="#/dashboard" class="nav-item active" data-view="dashboard">📊 Dashboard</a></li>
                    <li><a href="#/transacoes" class="nav-item" data-view="transacoes">💳 Transações</a></li>
                    <li><a href="#/planejamento" class="nav-item" data-view="planejamento">🎯 Planejamento</a></li>
                    <li><a href="#/relatorios" class="nav-item" data-view="relatorios">📈 Relatórios</a></li>
                    <li><a href="#/configuracoes" class="nav-item" data-view="configuracoes">⚙️ Configurações</a></li>
                </ul>
                <div class="sidebar-footer">
                    <button id="sidebar-logout" class="nav-item">🚪 Sair</button>
                </div>
            </nav>

            <!-- Main Content -->
            <main id="main-content">
                <div id="view-container">
                    <div style="text-align:center;padding:40px;color:var(--text-muted);">Carregando...</div>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- Registro do Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
            registrations.forEach(reg => reg.unregister());
        });

        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(registration => {
                console.log('SW registrado com sucesso!');
            })
            .catch(err => {
                console.warn('Erro ao registrar SW:', err);
            });
    }
    </script>
</body>
</html>

<!-- offline.html - Página exibida quando offline -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Nexus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, 'Inter', sans-serif;
            background: #f8f6ff;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .offline-container {
            max-width: 400px;
            padding: 40px 32px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(106, 90, 205, 0.12);
            border: 1px solid #e8e4f0;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #8b7fe8;
            margin-bottom: 8px;
        }
        p {
            color: #4a4a6a;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #8b7fe8;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 28px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(106, 90, 205, 0.3);
        }
        .btn-secondary {
            background: #f5f3ff;
            color: #4a4a6a;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: #e8e4f0;
            box-shadow: none;
        }
        .status {
            font-size: 0.8rem;
            color: #8a8aaa;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>Você está offline</h1>
        <p>
            Oops! Parece que você perdeu a conexão com a internet.
            Algumas funcionalidades podem estar indisponíveis até que a conexão seja restabelecida.
        </p>
        <button class="btn" onclick="window.location.reload()">🔄 Tentar novamente</button>
        <div style="margin-top: 8px;">
            <button class="btn btn-secondary" onclick="window.location.href='/'">🏠 Ir para o Dashboard</button>
        </div>
        <div class="status">
            Conecte-se à internet para acessar todas as funcionalidades do Nexus.
        </div>
    </div>

    <script>
        // Tenta detectar quando a conexão for restabelecida
        window.addEventListener('online', () => {
            document.querySelector('.offline-container p').textContent = 
                '✅ Conexão restabelecida! Clique em "Tentar novamente" para recarregar.';
            document.querySelector('.offline-container .status').textContent = 
                'Conectado! Atualize a página para continuar.';
        });
    </script>
</body>
</html>

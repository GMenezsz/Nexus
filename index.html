<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Inter -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- PWA Meta Tags fundamentais para modo tela cheia -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexus">
</head>
<body>

    <header id="main-header" style="display: none;">
        <div class="header-left">
            <button id="menu-toggle" class="icon-btn">☰</button>
            <div class="brand">Nexus</div>
        </div>
        <div class="header-right">
            <button id="pwa-install-btn" class="btn-install" hidden>
                <span>📲</span> <span class="install-label">Instalar App</span>
            </button>
            <button id="theme-toggle" class="icon-btn">🌙</button>
        </div>
    </header>

    <div class="app-container">
        <aside id="sidebar" class="sidebar" style="display: none;">
            <ul class="nav-list">
                <li><button class="nav-item active" href="#/dashboard"><span class="nav-icon">📊</span><span class="nav-text">Dashboard</span></button></li>
                <li><button class="nav-item" href="#/transacoes"><span class="nav-icon">💳</span><span class="nav-text">Transações</span></button></li>
                <li><button class="nav-item" href="#/planejamento"><span class="nav-icon">🎯</span><span class="nav-text">Planejamento</span></button></li>
                <li><button class="nav-item" href="#/relatorios"><span class="nav-icon">📈</span><span class="nav-text">Relatórios</span></button></li>
                <li><button class="nav-item" href="#/configuracoes"><span class="nav-icon">⚙️</span><span class="nav-text">Configurações</span></button></li>
            </ul>
            <div class="sidebar-footer">
                <button id="sidebar-logout" class="nav-item"><span class="nav-icon">🚪</span><span class="nav-text">Sair</span></button>
            </div>
        </aside>

        <main id="main-content">
            <div id="view-container"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

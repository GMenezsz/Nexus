<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE7D9;
    --paper-deep: #E4DCC8;
    --ink: #21302A;
    --ink-soft: #5B6459;
    --rule: #BEB295;
    --receita: #2E6F4E;
    --despesa: #9C3B26;
    --gold: #B98A2E;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-deep) 1px, transparent 1px);
    background-size: 100% 2.4em;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:2.5rem 1.5rem 5rem;
  }

  /* Cabeçalho */
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--ink);
    padding-bottom:0.9rem;
    margin-bottom:2rem;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.01em;
  }
  #usuario-tag{
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  /* Tela de login */
  #tela-login{
    max-width:360px;
    margin:3rem auto;
    text-align:center;
  }
  #tela-login p{
    color:var(--ink-soft);
    margin-top:-0.4rem;
    margin-bottom:1.6rem;
  }
  .campo{
    margin-bottom:0.9rem;
    text-align:left;
  }
  .campo label{
    display:block;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-bottom:0.3rem;
  }
  .campo input, .campo select{
    width:100%;
    padding:0.6rem 0.7rem;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.95rem;
    border:1px solid var(--rule);
    background:#fff8ec;
    color:var(--ink);
    border-radius:3px;
  }
  .campo input:focus, .campo select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  button{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:0.9rem;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:0.65rem 1.2rem;
    border-radius:3px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{ opacity:0.85; }
  button.secundario{
    background:transparent;
    color:var(--ink);
  }
  #erro-login{
    color:var(--despesa);
    font-size:0.85rem;
    min-height:1.2em;
    margin-top:0.6rem;
  }

  /* Saldo */
  #painel-saldo{
    text-align:center;
    padding:1.6rem 0 1.8rem;
    border-bottom:1px solid var(--rule);
    margin-bottom:1.8rem;
  }
  #painel-saldo .rotulo{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-bottom:0.3rem;
  }
  #saldo-valor{
    font-family:'Fraunces', serif;
    font-size:3rem;
    font-weight:500;
    font-variant-numeric: tabular-nums;
    line-height:1;
  }
  #saldo-valor.positivo{ color:var(--receita); }
  #saldo-valor.negativo{ color:var(--despesa); }
  .subtotais{
    display:flex;
    justify-content:center;
    gap:2.2rem;
    margin-top:1rem;
    font-size:0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .subtotais span.num{ font-weight:600; }
  .subtotais .receitas .num{ color:var(--receita); }
  .subtotais .despesas .num{ color:var(--despesa); }

  /* Formulário nova transação */
  section.bloco{ margin-bottom:2.2rem; }
  section.bloco h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.05rem;
    margin:0 0 0.9rem;
  }

  .abas{
    display:flex;
    gap:0;
    margin-bottom:1rem;
    border-bottom:1px solid var(--rule);
  }
  .aba{
    flex:1;
    text-align:center;
    padding:0.55rem 0;
    cursor:pointer;
    font-size:0.9rem;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .aba.ativa[data-tipo="receita"]{ color:var(--receita); border-color:var(--receita); }
  .aba.ativa[data-tipo="despesa"]{ color:var(--despesa); border-color:var(--despesa); }

  #form-transacao{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:0.7rem;
    align-items:end;
  }
  #form-transacao .campo{ margin-bottom:0; }
  #form-transacao input#valor{ width:8.5rem; }
  #erro-transacao{
    grid-column:1/-1;
    color:var(--despesa);
    font-size:0.85rem;
    min-height:1.1em;
  }

  /* Lista */
  table{
    width:100%;
    border-collapse:collapse;
    font-size:0.92rem;
  }
  thead th{
    text-align:left;
    font-weight:500;
    color:var(--ink-soft);
    font-size:0.8rem;
    padding-bottom:0.5rem;
    border-bottom:1px solid var(--ink);
  }
  thead th.col-valor{ text-align:right; }
  tbody td{
    padding:0.65rem 0;
    border-bottom:1px solid var(--rule);
    vertical-align:middle;
  }
  tbody td.col-valor{
    text-align:right;
    font-variant-numeric: tabular-nums;
    font-weight:500;
    white-space:nowrap;
  }
  tr.receita td.col-valor{ color:var(--receita); }
  tr.despesa td.col-valor{ color:var(--despesa); }
  td.col-remover{ text-align:right; width:2rem; }
  td.col-remover button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:1rem;
    padding:0 0.3rem;
    cursor:pointer;
  }
  td.col-remover button:hover{ color:var(--despesa); }
  #lista-vazia{
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:1.2rem 0;
    text-align:center;
    display:none;
  }

  #tela-app{ display:none; }

  @media (max-width:520px){
    #form-transacao{ grid-template-columns:1fr; }
    #form-transacao input#valor{ width:100%; }
    #saldo-valor{ font-size:2.3rem; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- LOGIN -->
  <div id="tela-login">
    <h1 style="font-family:'Fraunces',serif;font-weight:500;font-size:1.7rem;margin-bottom:0.2rem;">Livro Financeiro</h1>
    <p>Entre com seu nome para abrir seu livro-caixa.</p>
    <div class="campo">
      <label for="login-nome">Nome</label>
      <input id="login-nome" type="text" autocomplete="given-name">
    </div>
    <div class="campo">
      <label for="login-sobrenome">Sobrenome</label>
      <input id="login-sobrenome" type="text" autocomplete="family-name">
    </div>
    <button id="btn-entrar" style="width:100%;">Entrar</button>
    <div id="erro-login"></div>
  </div>

  <!-- APP -->
  <div id="tela-app">
    <header>
      <h1>Livro Financeiro</h1>
      <div>
        <span id="usuario-tag"></span>
        <button class="secundario" id="btn-sair" style="margin-left:0.8rem;padding:0.3rem 0.7rem;font-size:0.8rem;">Sair</button>
      </div>
    </header>

    <div id="painel-saldo">
      <div class="rotulo">Saldo atual</div>
      <div id="saldo-valor">R$ 0,00</div>
      <div class="subtotais">
        <span class="receitas">receitas <span class="num" id="total-receitas">R$ 0,00</span></span>
        <span class="despesas">despesas <span class="num" id="total-despesas">R$ 0,00</span></span>
      </div>
    </div>

    <section class="bloco">
      <h2>Novo lançamento</h2>
      <div class="abas">
        <div class="aba ativa" data-tipo="receita">Receita</div>
        <div class="aba" data-tipo="despesa">Despesa</div>
      </div>
      <form id="form-transacao">
        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" required></select>
        </div>
        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input id="valor" type="number" step="0.01" min="0" placeholder="0,00" required>
        </div>
        <button type="submit">Adicionar</button>
        <div id="erro-transacao"></div>
      </form>
    </section>

    <section class="bloco">
      <h2>Lançamentos</h2>
      <table>
        <thead>
          <tr>
            <th>Categoria</th>
            <th class="col-valor">Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corpo-lista"></tbody>
      </table>
      <div id="lista-vazia">Nenhum lançamento ainda. Adicione o primeiro acima.</div>
    </section>
  </div>

</div>

<script>
const API_BASE = "http://localhost:8000";

let usuarioId = null;
let tipoAtivo = "receita";
let categorias = { receita: [], despesa: [] };

const telaLogin = document.getElementById("tela-login");
const telaApp = document.getElementById("tela-app");

function formatarMoeda(v){
  return v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
}

// ---------- LOGIN ----------
document.getElementById("btn-entrar").addEventListener("click", async () => {
  const nome = document.getElementById("login-nome").value.trim();
  const sobrenome = document.getElementById("login-sobrenome").value.trim();
  const erroEl = document.getElementById("erro-login");
  erroEl.textContent = "";

  try {
    const resp = await fetch(`${API_BASE}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome, sobrenome })
    });
    const dados = await resp.json();
    if (!resp.ok) { erroEl.textContent = dados.detail || "Não foi possível entrar."; return; }

    usuarioId = dados.usuario_id;
    document.getElementById("usuario-tag").textContent = `${dados.nome} ${dados.sobrenome}`;
    telaLogin.style.display = "none";
    telaApp.style.display = "block";

    await carregarCategorias();
    await atualizarTudo();
  } catch (e) {
    erroEl.textContent = "Não foi possível falar com o servidor. Ele está rodando em " + API_BASE + "?";
  }
});

document.getElementById("btn-sair").addEventListener("click", () => {
  usuarioId = null;
  telaApp.style.display = "none";
  telaLogin.style.display = "block";
});

// ---------- CATEGORIAS / ABAS ----------
async function carregarCategorias(){
  const resp = await fetch(`${API_BASE}/categorias`);
  categorias = await resp.json();
  preencherSelectCategoria();
}

function preencherSelectCategoria(){
  const select = document.getElementById("categoria");
  select.innerHTML = "";
  (categorias[tipoAtivo] || []).forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  });
}

document.querySelectorAll(".aba").forEach(aba => {
  aba.addEventListener("click", () => {
    document.querySelectorAll(".aba").forEach(a => a.classList.remove("ativa"));
    aba.classList.add("ativa");
    tipoAtivo = aba.dataset.tipo;
    preencherSelectCategoria();
  });
});

// ---------- NOVA TRANSAÇÃO ----------
document.getElementById("form-transacao").addEventListener("submit", async (e) => {
  e.preventDefault();
  const categoria = document.getElementById("categoria").value;
  const valor = parseFloat(document.getElementById("valor").value);
  const erroEl = document.getElementById("erro-transacao");
  erroEl.textContent = "";

  try {
    const resp = await fetch(`${API_BASE}/transacoes`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario_id: usuarioId, tipo: tipoAtivo, categoria, valor })
    });
    const dados = await resp.json();
    if (!resp.ok) { erroEl.textContent = dados.detail || "Não foi possível salvar."; return; }

    document.getElementById("valor").value = "";
    await atualizarTudo();
  } catch (e) {
    erroEl.textContent = "Não foi possível falar com o servidor.";
  }
});

// ---------- LISTA E SALDO ----------
async function atualizarTudo(){
  await Promise.all([carregarResumo(), carregarLista()]);
}

async function carregarResumo(){
  const resp = await fetch(`${API_BASE}/transacoes/${usuarioId}/resumo`);
  const r = await resp.json();
  const saldoEl = document.getElementById("saldo-valor");
  saldoEl.textContent = formatarMoeda(r.saldo);
  saldoEl.classList.toggle("positivo", r.saldo >= 0);
  saldoEl.classList.toggle("negativo", r.saldo < 0);
  document.getElementById("total-receitas").textContent = formatarMoeda(r.total_receitas);
  document.getElementById("total-despesas").textContent = formatarMoeda(r.total_despesas);
}

async function carregarLista(){
  const resp = await fetch(`${API_BASE}/transacoes/${usuarioId}`);
  const r = await resp.json();
  const corpo = document.getElementById("corpo-lista");
  const vazio = document.getElementById("lista-vazia");
  corpo.innerHTML = "";

  if (!r.transacoes.length){
    vazio.style.display = "block";
    return;
  }
  vazio.style.display = "none";

  r.transacoes.forEach(t => {
    const tr = document.createElement("tr");
    tr.className = t.tipo.toLowerCase() === "receita" ? "receita" : "despesa";
    const sinal = tr.className === "receita" ? "+ " : "− ";
    tr.innerHTML = `
      <td>${t.categoria}</td>
      <td class="col-valor">${sinal}${formatarMoeda(t.valor)}</td>
      <td class="col-remover"><button title="Remover" data-id="${t.id}">✕</button></td>
    `;
    corpo.appendChild(tr);
  });

  corpo.querySelectorAll("button[data-id]").forEach(btn => {
    btn.addEventListener("click", async () => {
      await fetch(`${API_BASE}/transacoes/${btn.dataset.id}`, { method: "DELETE" });
      await atualizarTudo();
    });
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Nexus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Inter', sans-serif;
            background: #f8f6ff;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            padding: 48px 32px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(106,90,205,0.12);
            text-align: center;
            border: 1px solid #e8e4f0;
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; color: #8b7fe8; margin-bottom: 8px; }
        p { color: #4a4a6a; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #8b7fe8;
            color: #fff;
            border: none;
            border-radius: 28px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(106,90,205,0.3); }
        .btn-secondary {
            background: #f5f3ff;
            color: #4a4a6a;
            margin-top: 8px;
        }
        .btn-secondary:hover { background: #e8e4f0; transform: none; }
        .status { font-size: 0.8rem; color: #8a8aaa; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Você está offline</h1>
        <p>Ops! Parece que você perdeu a conexão. Conecte-se para acessar todas as funcionalidades do Nexus.</p>
        <button class="btn" onclick="window.location.reload()">🔄 Tentar novamente</button>
        <div style="margin-top:8px;">
            <button class="btn btn-secondary" onclick="window.location.href='/'">🏠 Dashboard</button>
        </div>
        <div class="status" id="status">Conecte-se à internet</div>
    </div>
    <script>
        window.addEventListener('online', () => {
            document.getElementById('status').textContent = '✅ Conectado! Atualize a página.';
        });
    </script>
</body>
</html>
